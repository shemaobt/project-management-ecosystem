pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 8.8.8.8 8.8.4.4 ipv6=off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/javascript text/css image/svg+xml;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # O ^~ não é enfeite: sem ele a regex de cache lá embaixo vence este prefixo
        # (no nginx, location regex ganha de location prefixo que não a dispensa), e
        # todo /api/*.png|jpg|svg cai no root e 404 em vez de ir para o proxy.
        #
        # E não há CORS aqui de propósito: este nginx serve a SPA e a API na mesma
        # origem, então o browser nem pergunta. O bloco que veio do RRF refletia de
        # volta o Origin de quem perguntasse, junto com Allow-Credentials: true — o
        # que libera qualquer site a fazer chamada credenciada e ler a resposta; e
        # quando o tripod-api chegar mandando os seus próprios cabeçalhos, dois
        # Access-Control-Allow-Origin fazem o browser recusar os dois. Quem responde
        # preflight é o backend, e o OPTIONS atravessa este proxy como qualquer método.
        location ^~ /api {
            proxy_pass ${BACKEND_URL}$request_uri;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_ssl_name $proxy_host;
            proxy_ssl_server_name on;

            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
