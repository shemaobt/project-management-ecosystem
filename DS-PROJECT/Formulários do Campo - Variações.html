<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Formulários do Campo — Variações</title>
<link rel="stylesheet" href="design-system/colors_and_type.css">
<style>
  html, body { margin: 0; background: #f0eee9; font-family: var(--font-sans); }
  /* Form artboard styles — scoped via .fma- prefix */
  .fma-frame { width: 100%; height: 100%; background: var(--shema-branco); display: flex; flex-direction: column; overflow: hidden; }
  .fma-statusbar { height: 28px; flex: 0 0 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 13px; font-weight: 600; color: var(--shema-verde); }
  .fma-statusbar .fma-dot { display: inline-flex; gap: 4px; align-items: center; }
  .fma-statusbar .fma-dot span { width: 4px; height: 4px; border-radius: 99px; background: currentColor; }

  .fma-scroll { flex: 1 1 auto; overflow: hidden; }
  .fma-pad { padding: 24px 24px 40px; }

  .fma-h-eyebrow { font: 600 12px/1 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--shema-telha); margin: 0 0 8px; }
  .fma-h-title { font: 700 30px/1.05 var(--font-sans); letter-spacing: -0.01em; margin: 0 0 8px; color: var(--shema-preto); text-wrap: balance; }
  .fma-h-sub { font: 400 15px/1.45 var(--font-serif); font-style: italic; color: var(--fg-muted); margin: 0; text-wrap: pretty; }

  .fma-section-label { font: 600 11px/1 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-subtle); margin: 28px 0 12px; display: flex; align-items: baseline; gap: 8px; }
  .fma-section-label .fma-num { color: var(--shema-telha); font-weight: 700; }

  .fma-q { font: 600 17px/1.3 var(--font-sans); color: var(--shema-preto); margin: 0 0 12px; }
  .fma-hint { font: 400 13px/1.4 var(--font-sans); color: var(--fg-muted); margin: -6px 0 12px; }

  .fma-input { width: 100%; padding: 14px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font: 400 15px/1.3 var(--font-sans); color: var(--shema-preto); outline: none; box-sizing: border-box; }
  .fma-input::placeholder { color: var(--fg-subtle); }
  .fma-textarea { min-height: 90px; resize: none; }

  /* Face buttons */
  .fma-faces { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .fma-face { aspect-ratio: 1; border: 1.5px solid var(--line); border-radius: 18px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: all 0.2s; }
  .fma-face.fma-selected { border-color: var(--shema-telha); background: var(--accent-soft); border-width: 2px; }
  .fma-face svg { width: 36px; height: 36px; }
  .fma-face-label { font: 600 11px/1 var(--font-sans); color: var(--fg-muted); }
  .fma-face.fma-selected .fma-face-label { color: var(--shema-telha); }

  /* Chips */
  .fma-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .fma-chip { padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font: 500 13px/1 var(--font-sans); color: var(--fg); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .fma-chip.fma-on { background: var(--shema-verde); color: var(--shema-branco); border-color: var(--shema-verde); }
  .fma-chip.fma-urgent { background: var(--shema-telha); color: #fff; border-color: var(--shema-telha); }

  /* Counter */
  .fma-counter { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
  .fma-counter-label { font: 600 14px/1.2 var(--font-sans); color: var(--shema-preto); }
  .fma-counter-label-sub { font: 400 12px/1.2 var(--font-sans); color: var(--fg-muted); margin-top: 2px; }
  .fma-counter-ctl { display: flex; align-items: center; gap: 10px; }
  .fma-counter-btn { width: 32px; height: 32px; border-radius: 999px; background: var(--bg-muted); border: 0; font: 600 18px/1 var(--font-sans); color: var(--shema-verde); cursor: pointer; }
  .fma-counter-val { font: 700 22px/1 var(--font-sans); color: var(--shema-preto); min-width: 32px; text-align: center; }
  .fma-counter-delta { font: 500 11px/1 var(--font-sans); color: #4a7a3a; margin-top: 4px; text-align: center; }

  /* Voice */
  .fma-voice { display: flex; align-items: center; gap: 12px; padding: 14px; background: #fff; border: 1px dashed var(--line); border-radius: 14px; }
  .fma-mic { width: 44px; height: 44px; border-radius: 999px; background: var(--shema-telha); color: #fff; display: flex; align-items: center; justify-content: center; flex: 0 0 44px; }
  .fma-voice-label { font: 600 13px/1.2 var(--font-sans); color: var(--shema-preto); }
  .fma-voice-sub { font: 400 12px/1.3 var(--font-sans); color: var(--fg-muted); margin-top: 3px; }

  /* Photo drop */
  .fma-drop { aspect-ratio: 16/10; border: 1px dashed var(--line); border-radius: 16px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--fg-muted); }
  .fma-drop-icon { width: 36px; height: 36px; color: var(--fg-subtle); }
  .fma-drop-label { font: 600 13px/1 var(--font-sans); }
  .fma-drop-sub { font: 400 12px/1.2 var(--font-sans); color: var(--fg-subtle); }

  /* Buttons */
  .fma-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 18px; border-radius: 999px; font: 600 14px/1 var(--font-sans); letter-spacing: 0.02em; border: 0; cursor: pointer; width: 100%; box-sizing: border-box; }
  .fma-btn-primary { background: var(--shema-telha); color: #fff; }
  .fma-btn-ghost { background: transparent; color: var(--shema-verde); border: 1.5px solid var(--shema-verde); }
  .fma-btn-dark { background: var(--shema-verde); color: var(--shema-branco); }

  .fma-foot { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
  .fma-foot-note { font: 400 12px/1.4 var(--font-sans); color: var(--fg-subtle); text-align: center; }

  /* progress dots */
  .fma-progress { display: flex; gap: 6px; }
  .fma-progress span { flex: 1; height: 3px; border-radius: 99px; background: var(--line); }
  .fma-progress span.fma-on { background: var(--shema-telha); }

  /* Variation B — Multimodal */
  .fmb-frame { background: var(--shema-verde); color: var(--shema-branco); }
  .fmb-statusbar { color: var(--shema-branco) !important; }
  .fmb-topbar { padding: 16px 24px 0; display: flex; align-items: center; justify-content: space-between; }
  .fmb-logo { display: flex; align-items: center; gap: 8px; }
  .fmb-logo-mark { width: 28px; height: 28px; }
  .fmb-logo-name { font: 700 14px/1 var(--font-sans); letter-spacing: 0.02em; color: var(--shema-branco); }
  .fmb-step-dots { display: flex; gap: 5px; }
  .fmb-step-dots span { width: 22px; height: 3px; border-radius: 99px; background: rgba(246,245,235,0.25); }
  .fmb-step-dots span.fmb-on { background: var(--shema-telha); }
  .fmb-step-dots span.fmb-done { background: var(--shema-branco); }

  .fmb-header { padding: 32px 24px 18px; }
  .fmb-eyebrow { font: 600 11px/1 var(--font-sans); letter-spacing: 0.18em; text-transform: uppercase; color: var(--shema-telha); margin: 0 0 10px; }
  .fmb-title { font: 400 38px/1.05 var(--font-serif); font-style: italic; color: var(--shema-branco); margin: 0; letter-spacing: -0.01em; }
  .fmb-sub { font: 400 14px/1.5 var(--font-sans); color: rgba(246,245,235,0.7); margin: 14px 0 0; }

  .fmb-card { margin: 0 16px 16px; padding: 22px 20px; border-radius: 22px; background: rgba(246,245,235,0.06); border: 1px solid rgba(246,245,235,0.12); position: relative; }
  .fmb-card-step { font: 700 10px/1 var(--font-sans); letter-spacing: 0.18em; text-transform: uppercase; color: var(--shema-telha); margin-bottom: 10px; }
  .fmb-card-title { font: 700 22px/1.1 var(--font-sans); color: var(--shema-branco); margin: 0 0 6px; }
  .fmb-card-prompt { font: 400 14px/1.45 var(--font-sans); color: rgba(246,245,235,0.7); margin: 0 0 18px; }
  .fmb-action-big { width: 100%; padding: 28px 18px; border-radius: 18px; background: var(--shema-telha); color: #fff; border: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; }
  .fmb-action-big svg { width: 36px; height: 36px; }
  .fmb-action-label { font: 700 14px/1 var(--font-sans); letter-spacing: 0.04em; }
  .fmb-action-meta { font: 500 12px/1 var(--font-sans); color: rgba(255,255,255,0.75); }

  .fmb-record-bar { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 10px 12px; background: rgba(246,245,235,0.08); border-radius: 14px; }
  .fmb-record-bar svg { color: var(--shema-telha); flex: 0 0 auto; }
  .fmb-record-bar-text { font: 600 12px/1.2 var(--font-sans); color: var(--shema-branco); }
  .fmb-record-bar-time { font: 600 12px/1 var(--font-sans); color: rgba(246,245,235,0.6); margin-left: auto; }

  .fmb-photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fmb-photo { aspect-ratio: 1; border-radius: 12px; background-size: cover; background-position: center; position: relative; overflow: hidden; }
  .fmb-photo.fmb-add { background: rgba(246,245,235,0.08); border: 1px dashed rgba(246,245,235,0.25); display: flex; align-items: center; justify-content: center; color: rgba(246,245,235,0.5); font-size: 28px; font-weight: 300; }

  .fmb-num-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .fmb-num { padding: 14px 10px; background: rgba(246,245,235,0.06); border: 1px solid rgba(246,245,235,0.14); border-radius: 14px; text-align: center; }
  .fmb-num-val { font: 700 28px/1 var(--font-sans); color: var(--shema-branco); }
  .fmb-num-label { font: 600 10px/1.2 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(246,245,235,0.65); margin-top: 6px; }
  .fmb-num-delta { font: 600 11px/1 var(--font-sans); color: #b4d18f; margin-top: 4px; }

  .fmb-chip-dark { padding: 9px 14px; border: 1px solid rgba(246,245,235,0.22); border-radius: 999px; background: transparent; font: 500 13px/1 var(--font-sans); color: rgba(246,245,235,0.85); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .fmb-chip-dark.fmb-on { background: var(--shema-telha); color: #fff; border-color: var(--shema-telha); }

  .fmb-foot { padding: 16px 24px 28px; display: flex; gap: 10px; align-items: center; }
  .fmb-cta { flex: 1; padding: 16px; border-radius: 999px; background: var(--shema-telha); color: #fff; border: 0; font: 700 14px/1 var(--font-sans); letter-spacing: 0.04em; cursor: pointer; }
  .fmb-cta-ghost { flex: 0 0 52px; height: 52px; border-radius: 999px; background: transparent; border: 1.5px solid rgba(246,245,235,0.4); color: var(--shema-branco); display: flex; align-items: center; justify-content: center; }

  /* Variation C — Carta */
  .fmc-frame { background: var(--shema-branco); }
  .fmc-paper { padding: 36px 28px 32px; background: var(--shema-branco); position: relative; }
  .fmc-paper::before { content: ''; position: absolute; left: 28px; right: 28px; top: 26px; height: 1px; background: var(--line); }
  .fmc-meta { display: flex; justify-content: space-between; font: 500 11px/1 var(--font-sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-subtle); margin-bottom: 32px; }
  .fmc-greeting { font: 400 38px/1.1 var(--font-serif); font-style: italic; color: var(--shema-preto); margin: 0 0 6px; letter-spacing: -0.01em; }
  .fmc-greeting-sub { font: 400 13px/1.5 var(--font-sans); color: var(--fg-muted); margin: 0 0 28px; }

  .fmc-prompt { font: 400 16px/1.65 var(--font-serif); color: var(--shema-preto); margin: 0 0 4px; }
  .fmc-prompt em { color: var(--shema-telha); font-style: italic; font-weight: 400; }
  .fmc-fillline { display: block; width: 100%; min-height: 22px; padding: 4px 0 6px; border-bottom: 1px dashed var(--line-strong); font: 400 15px/1.5 var(--font-serif); color: var(--shema-verde); font-style: italic; }
  .fmc-fillline-multi { min-height: 60px; }
  .fmc-field-block { margin: 0 0 24px; }

  .fmc-divider { display: flex; align-items: center; gap: 14px; margin: 32px 0 20px; }
  .fmc-divider-rule { flex: 1; height: 1px; background: var(--line); }
  .fmc-divider-text { font: 600 11px/1 var(--font-sans); letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-subtle); }

  .fmc-ledger { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .fmc-ledger-cell { padding: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
  .fmc-ledger-label { font: 600 10px/1 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-subtle); margin-bottom: 8px; }
  .fmc-ledger-val { font: 700 22px/1 var(--font-sans); color: var(--shema-preto); }
  .fmc-ledger-meta { font: 400 11px/1.3 var(--font-sans); color: var(--fg-muted); margin-top: 4px; }

  .fmc-sign { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
  .fmc-sign-line { font: 400 14px/1.5 var(--font-serif); font-style: italic; color: var(--shema-preto); margin-bottom: 4px; }
  .fmc-sign-name { font: 700 18px/1 var(--font-sans); color: var(--shema-preto); margin-bottom: 4px; }
  .fmc-sign-role { font: 400 12px/1.3 var(--font-sans); color: var(--fg-muted); }
  .fmc-versicle { margin-top: 24px; padding: 18px; background: var(--bg-muted); border-radius: 14px; }
  .fmc-versicle-text { font: 400 13px/1.5 var(--font-serif); font-style: italic; color: var(--shema-verde); margin: 0; }
  .fmc-versicle-ref { font: 600 11px/1 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-subtle); margin-top: 8px; }

  .fmc-cta-row { padding: 18px 24px 28px; display: flex; gap: 10px; background: var(--bg-muted); }
  .fmc-cta { flex: 1; padding: 14px 18px; border-radius: 999px; font: 600 13px/1 var(--font-sans); letter-spacing: 0.04em; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .fmc-cta-primary { background: var(--shema-telha); color: #fff; }
  .fmc-cta-ghost { background: transparent; color: var(--shema-verde); border: 1.5px solid var(--shema-verde); }

  /* Photo placeholder shared */
  .fma-photo-thumb { aspect-ratio: 5/3; border-radius: 14px; background: linear-gradient(135deg, var(--shema-telha) 0%, var(--shema-verde-claro) 100%); position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 14px; }
  .fma-photo-cap { color: #fff; font: 600 12px/1.3 var(--font-sans); }

  /* Notify confirmation row (for Variation A) */
  .fma-notify { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--bg-muted); border-radius: 14px; margin: 28px 0 0; }
  .fma-notify-icon { width: 36px; height: 36px; border-radius: 999px; background: #fff; display: flex; align-items: center; justify-content: center; color: var(--shema-telha); flex: 0 0 36px; }
  .fma-notify-text { flex: 1; }
  .fma-notify-title { font: 600 13px/1.2 var(--font-sans); color: var(--shema-preto); }
  .fma-notify-sub { font: 400 11px/1.3 var(--font-sans); color: var(--fg-muted); margin-top: 3px; }

  /* Toggle switch */
  .fma-switch { position: relative; width: 38px; height: 22px; flex: 0 0 38px; cursor: pointer; }
  .fma-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .fma-switch span { position: absolute; inset: 0; background: rgba(63,62,32,0.2); border-radius: 999px; transition: background 0.18s; }
  .fma-switch span::before { content: ''; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; background: #fff; border-radius: 999px; box-shadow: 0 1px 2px rgba(0,0,0,0.15); transition: transform 0.18s; }
  .fma-switch input:checked + span { background: var(--shema-telha); }
  .fma-switch input:checked + span::before { transform: translateX(16px); }
  .fma-switch-lg { width: 46px; height: 26px; flex: 0 0 46px; }
  .fma-switch-lg span::before { width: 22px; height: 22px; }
  .fma-switch-lg input:checked + span::before { transform: translateX(20px); }

  /* Notify row in dark variant B */
  .fmb-notify { margin: 4px 16px 0; padding: 12px 16px; background: rgba(246,245,235,0.06); border: 1px solid rgba(246,245,235,0.12); border-radius: 14px; display: flex; align-items: center; gap: 10px; color: var(--shema-branco); }
  .fmb-notify svg { color: var(--shema-telha); flex: 0 0 auto; }
  .fmb-notify-text { flex: 1; font: 500 12px/1.3 var(--font-sans); color: rgba(246,245,235,0.85); }
  .fmb-switch { position: relative; width: 38px; height: 22px; flex: 0 0 38px; cursor: pointer; }
  .fmb-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .fmb-switch span { position: absolute; inset: 0; background: rgba(246,245,235,0.18); border-radius: 999px; transition: background 0.18s; }
  .fmb-switch span::before { content: ''; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; background: var(--shema-branco); border-radius: 999px; transition: transform 0.18s; }
  .fmb-switch input:checked + span { background: var(--shema-telha); }
  .fmb-switch input:checked + span::before { transform: translateX(16px); }

  /* ===== Variation D — Notifications panel (coordinator) ===== */
  .fmn-frame { background: var(--shema-branco); }
  .fmn-topbar { padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: var(--shema-branco); }
  .fmn-back { width: 36px; height: 36px; border-radius: 999px; border: 0; background: transparent; font: 500 22px/1 var(--font-sans); color: var(--shema-verde); cursor: pointer; }
  .fmn-topbar-title { font: 600 13px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); }

  .fmn-pad { padding: 28px 24px 40px; }

  .fmn-masterbox { display: flex; align-items: center; gap: 14px; margin: 24px 0 8px; padding: 18px; background: var(--shema-verde); border-radius: 18px; color: var(--shema-branco); }
  .fmn-masterbox-icon { width: 44px; height: 44px; border-radius: 999px; background: rgba(246,245,235,0.12); display: flex; align-items: center; justify-content: center; color: var(--shema-branco); flex: 0 0 44px; }
  .fmn-masterbox-title { font: 700 16px/1.2 var(--font-sans); color: var(--shema-branco); }
  .fmn-masterbox-sub { font: 500 12px/1.3 var(--font-sans); color: rgba(246,245,235,0.7); margin-top: 4px; }
  .fmn-masterbox .fma-switch span { background: rgba(246,245,235,0.25); }

  .fmn-list { display: flex; flex-direction: column; gap: 8px; }
  .fmn-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
  .fmn-row-on { border-color: var(--shema-telha); background: var(--accent-soft); }
  .fmn-row-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--bg-muted); display: flex; align-items: center; justify-content: center; color: var(--shema-verde); flex: 0 0 36px; }
  .fmn-row-on .fmn-row-icon { background: var(--shema-telha); color: #fff; }
  .fmn-row-text { flex: 1; }
  .fmn-row-title { font: 600 14px/1.2 var(--font-sans); color: var(--shema-preto); }
  .fmn-row-sub { font: 400 12px/1.3 var(--font-sans); color: var(--fg-muted); margin-top: 3px; }

  .fmn-radiogroup { display: flex; flex-direction: column; gap: 8px; }
  .fmn-radio { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; background: #fff; border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; }
  .fmn-radio-on { border-color: var(--shema-telha); background: var(--accent-soft); }
  .fmn-radio-dot { width: 20px; height: 20px; border-radius: 999px; border: 2px solid var(--line-strong); background: #fff; flex: 0 0 20px; margin-top: 1px; position: relative; }
  .fmn-radio-on .fmn-radio-dot { border-color: var(--shema-telha); }
  .fmn-radio-on .fmn-radio-dot::after { content: ''; position: absolute; inset: 3px; border-radius: 999px; background: var(--shema-telha); }
  .fmn-radio-title { font: 600 14px/1.2 var(--font-sans); color: var(--shema-preto); }
  .fmn-radio-sub { font: 400 12px/1.4 var(--font-sans); color: var(--fg-muted); margin-top: 3px; }

  .fmn-scope { display: flex; flex-direction: column; gap: 8px; }
  .fmn-scope-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; }
  .fmn-scope-row-on { border-color: var(--shema-verde); background: rgba(63,62,32,0.04); }
  .fmn-scope-radio { width: 24px; height: 24px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: #fff; display: flex; align-items: center; justify-content: center; color: var(--shema-branco); flex: 0 0 24px; }
  .fmn-scope-row-on .fmn-scope-radio { background: var(--shema-verde); border-color: var(--shema-verde); }
  .fmn-scope-title { font: 600 14px/1.2 var(--font-sans); color: var(--shema-preto); }
  .fmn-scope-sub { font: 400 12px/1.3 var(--font-sans); color: var(--fg-muted); margin-top: 3px; }

  .fmn-preview { padding: 16px; background: #fff; border-radius: 18px; box-shadow: var(--shadow-md); border: 1px solid var(--line); }
  .fmn-preview-app { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .fmn-preview-app-name { font: 700 12px/1 var(--font-sans); color: var(--shema-verde); letter-spacing: 0.02em; }
  .fmn-preview-app-time { font: 500 11px/1 var(--font-sans); color: var(--fg-subtle); margin-left: auto; }
  .fmn-preview-title { font: 700 15px/1.3 var(--font-sans); color: var(--shema-preto); margin-bottom: 4px; }
  .fmn-preview-body { font: 400 13px/1.4 var(--font-sans); color: var(--fg-muted); }
  .fmn-preview-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .fmn-tag { padding: 4px 10px; border-radius: 999px; font: 600 11px/1.2 var(--font-sans); background: var(--bg-muted); color: var(--fg); }
  .fmn-tag-warn { background: var(--accent-soft); color: var(--shema-telha); }
  .fmn-tag-need { background: #e5e8d6; color: var(--shema-verde-claro); }

  .fmn-log { display: flex; flex-direction: column; }
  .fmn-log-row { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
  .fmn-log-row:last-child { border-bottom: 0; }
  .fmn-log-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--line-strong); flex: 0 0 8px; }
  .fmn-log-dot-new { background: var(--shema-telha); box-shadow: 0 0 0 4px var(--accent-soft); }
  .fmn-log-dot-urgent { background: var(--shema-telha); box-shadow: 0 0 0 4px var(--accent-soft); }
  .fmn-log-title { font: 600 13px/1.2 var(--font-sans); color: var(--shema-preto); }
  .fmn-log-sub { font: 400 11px/1.3 var(--font-sans); color: var(--fg-muted); margin-top: 2px; }
  .fmn-log-time { font: 500 11px/1 var(--font-sans); color: var(--fg-subtle); flex: 0 0 auto; }

  /* ===== Variation E — Health assessment (OBT Lab during call) ===== */
  .fme-frame { background: var(--shema-branco); }
  .fme-meetbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--shema-verde); color: var(--shema-branco); flex: 0 0 auto; }
  .fme-livedot { width: 8px; height: 8px; border-radius: 999px; background: #e2614a; box-shadow: 0 0 0 4px rgba(226,97,74,0.25); }
  .fme-meetbar-text { font: 600 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--shema-branco); }
  .fme-meetbar-time { font: 500 11px/1 var(--font-sans); color: rgba(246,245,235,0.7); margin-left: 4px; }
  .fme-participants { display: flex; margin-left: auto; }
  .fme-avatar { width: 24px; height: 24px; border-radius: 999px; border: 2px solid var(--shema-verde); margin-left: -6px; display: flex; align-items: center; justify-content: center; font: 700 10px/1 var(--font-sans); color: #fff; }
  .fme-avatar-more { background: rgba(246,245,235,0.18); color: var(--shema-branco); }

  .fme-pad { padding: 28px 24px 40px; }

  .fme-howto { display: flex; gap: 12px; padding: 14px 16px; background: var(--bg-muted); border-radius: 14px; margin: 22px 0 8px; }
  .fme-howto-icon { width: 24px; height: 24px; border-radius: 999px; background: var(--shema-verde); color: var(--shema-branco); display: flex; align-items: center; justify-content: center; font: 700 13px/1 var(--font-serif); font-style: italic; flex: 0 0 24px; }
  .fme-howto-title { font: 600 13px/1.2 var(--font-sans); color: var(--shema-preto); margin-bottom: 4px; }
  .fme-howto-text { font: 400 12px/1.45 var(--font-sans); color: var(--fg-muted); }

  .fme-dim { margin: 28px 0; padding: 22px 20px; background: #fff; border-radius: 18px; border: 1px solid var(--line); }
  .fme-dim-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .fme-dim-num { font: 700 11px/1 var(--font-sans); letter-spacing: 0.14em; color: var(--fg-subtle); }
  .fme-dim-cat { font: 700 11px/1 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
  .fme-cat-emo { background: var(--accent-soft); color: var(--shema-telha); }
  .fme-cat-rel { background: #e5e8d6; color: var(--shema-verde-claro); }
  .fme-cat-esp { background: #d8e3df; color: #4a6b62; }
  .fme-cat-fis { background: #efe6d4; color: #8a6a3a; }

  .fme-dim-q { font: 700 20px/1.25 var(--font-sans); color: var(--shema-preto); margin: 4px 0 14px; letter-spacing: -0.005em; }

  .fme-prompts { background: var(--bg-muted); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .fme-prompts-label { font: 700 10px/1 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-subtle); margin-bottom: 8px; }
  .fme-prompts-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .fme-prompts-list li { font: 400 14px/1.4 var(--font-serif); font-style: italic; color: var(--shema-verde); position: relative; padding-left: 16px; }
  .fme-prompts-list li::before { content: '·'; position: absolute; left: 6px; top: -2px; color: var(--shema-telha); font-weight: 700; font-style: normal; font-size: 22px; }

  .fme-rating { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .fme-rate { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; font: inherit; color: var(--fg-muted); transition: all 0.15s; }
  .fme-rate-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
  .fme-rate-icon svg { width: 28px; height: 28px; }
  .fme-rate-label { font: 600 12px/1 var(--font-sans); letter-spacing: 0.02em; }
  .fme-rate-good.fme-rate-on { border-color: #7a8a4a; background: #eef0e0; color: #4a5a30; border-width: 2px; }
  .fme-rate-warn.fme-rate-on { border-color: var(--shema-telha); background: var(--accent-soft); color: var(--shema-telha); border-width: 2px; }
  .fme-rate-crit.fme-rate-on { border-color: #b03a1a; background: #f4d8d2; color: #8a2a10; border-width: 2px; }

  .fme-notes { font-size: 13px; }

  .fme-summary { margin: 32px 0 16px; padding: 22px 20px; background: var(--shema-verde); border-radius: 18px; color: var(--shema-branco); }
  .fme-summary-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .fme-overall { font: 700 13px/1 var(--font-sans); letter-spacing: 0.04em; padding: 6px 12px; border-radius: 999px; background: var(--shema-telha); color: #fff; }
  .fme-summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fme-summary-cell { padding: 12px 14px; background: rgba(246,245,235,0.08); border-radius: 12px; display: flex; align-items: center; gap: 10px; }
  .fme-summary-label { font: 600 12px/1 var(--font-sans); color: rgba(246,245,235,0.85); flex: 1; }
  .fme-summary-dot { width: 10px; height: 10px; border-radius: 999px; flex: 0 0 10px; }
  .fme-summary-dot-good { background: #b4d18f; }
  .fme-summary-dot-warn { background: var(--shema-telha); }
  .fme-summary-dot-crit { background: #e2614a; }
  .fme-summary-status { font: 700 11px/1 var(--font-sans); color: var(--shema-branco); }

  .fme-pastoral { margin: 18px 0 8px; padding: 22px 20px; background: #fff; border-radius: 18px; border: 1px solid var(--line); }
  .fme-pastoral-q { font: 700 17px/1.3 var(--font-sans); color: var(--shema-preto); margin: 0 0 14px; }
  .fme-pastoral-opts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .fme-pastoral-opt { padding: 10px 8px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font: 600 12px/1.2 var(--font-sans); color: var(--fg); cursor: pointer; }
  .fme-pastoral-opt-on { background: var(--shema-telha); color: #fff; border-color: var(--shema-telha); }

</style>
