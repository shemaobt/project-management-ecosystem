name: Deploy (Cloud Run)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag já existente no Artifact Registry para redeploy (rollback). Vazio = constrói o commit atual."
        required: false
        default: ""

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  GAR_REPO: project-management-ecosystem
  FRONTEND_SERVICE: project-management-ecosystem
  SECRET_NAME: project_management_ecosystem_env
  SECRET_MOUNT_PATH: /run/secrets/.env

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-project-management-ecosystem
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
          RUNTIME_SA: ${{ vars.CLOUD_RUN_RUNTIME_SA }}
          SECRETS_PROJECT_REF: ${{ vars.GCP_SECRETS_PROJECT_REF }}
        run: |
          if [ -z "${GCP_PROJECT_ID}" ]; then echo "::error::GCP_PROJECT_ID is not set. gh secret set GCP_PROJECT_ID"; exit 1; fi
          if [ -z "${WIF_PROVIDER}" ]; then echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER is not set. gh secret set GCP_WORKLOAD_IDENTITY_PROVIDER — see docs/deploy.md §2.5"; exit 1; fi
          if [ -z "${WIF_SERVICE_ACCOUNT}" ]; then echo "::error::GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT is not set. gh secret set GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT — see docs/deploy.md §2.5"; exit 1; fi
          if [ -z "${RUNTIME_SA}" ]; then echo "::error::CLOUD_RUN_RUNTIME_SA is not set. gh variable set CLOUD_RUN_RUNTIME_SA --body <sa>@<project>.iam.gserviceaccount.com — see docs/deploy.md"; exit 1; fi
          if [ -z "${SECRETS_PROJECT_REF}" ]; then echo "::error::GCP_SECRETS_PROJECT_REF is not set. gh variable set GCP_SECRETS_PROJECT_REF --body <número do projeto shemaobt-secrets> — see docs/deploy.md §2.4"; exit 1; fi
          echo "Required secrets and variables are set."

      - name: Resolve target image
        id: target
        env:
          REQUESTED_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          TAG="${REQUESTED_TAG}"
          if [ -z "${TAG}" ]; then
            TAG="${GITHUB_SHA}"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            case "${TAG}" in
              *[!A-Za-z0-9._-]*) echo "::error::image_tag '${TAG}' has characters an Artifact Registry tag cannot carry."; exit 1 ;;
            esac
            if [ "${TAG}" = "latest" ]; then
              echo "::error::A rollback names an immutable tag, never 'latest' — otherwise what is running stops being answerable from the service description. Pick a commit SHA: gcloud artifacts docker images list ... --include-tags"
              exit 1
            fi
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPO}/frontend:${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target tag: ${TAG}"

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build frontend image
        if: steps.target.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.target.outputs.image }}
        run: |
          docker build \
            -t "${IMAGE}" \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPO}/frontend:latest" \
            .

      - name: Push frontend image
        if: steps.target.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.target.outputs.image }}
        run: |
          docker push "${IMAGE}"
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPO}/frontend:latest"

      - name: Verify requested image exists
        if: steps.target.outputs.build == 'false'
        env:
          IMAGE: ${{ steps.target.outputs.image }}
        run: |
          if ! gcloud artifacts docker images describe "${IMAGE}" --project "${PROJECT_ID}" >/dev/null; then
            echo "::error::${IMAGE} could not be confirmed in Artifact Registry — it does not exist, or the deploy service account cannot see it. A rollback redeploys an existing tag, it never rebuilds."
            exit 1
          fi
          echo "Rollback target found in Artifact Registry."

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          RUNTIME_SA: ${{ vars.CLOUD_RUN_RUNTIME_SA }}
          SECRETS_PROJECT_REF: ${{ vars.GCP_SECRETS_PROJECT_REF }}
        run: |
          gcloud run deploy "${FRONTEND_SERVICE}" \
            --image "${IMAGE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --port 8080 \
            --allow-unauthenticated \
            --service-account "${RUNTIME_SA}" \
            --set-secrets "${SECRET_MOUNT_PATH}=projects/${SECRETS_PROJECT_REF}/secrets/${SECRET_NAME}:latest" \
            --memory 256Mi \
            --cpu 1 \
            --concurrency 80 \
            --timeout 60

      - name: Verify the service is publicly reachable
        run: |
          URL=$(gcloud run services describe "${FRONTEND_SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format="value(status.url)")
          if [ -z "$URL" ]; then
            echo "::error::Cloud Run reported no URL for ${FRONTEND_SERVICE}."
            exit 1
          fi

          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 "${URL}/")
          if [ "$STATUS" = "403" ]; then
            echo "::error::${URL} answers 403, so the service is not public. --allow-unauthenticated failed to bind allUsers to roles/run.invoker and gcloud run deploy exited 0 anyway. Check the deploy service account still holds roles/run.admin — roles/run.developer cannot do this."
            exit 1
          fi
          if [ "$STATUS" != "200" ]; then
            echo "::error::${URL} answers ${STATUS}, expected 200."
            exit 1
          fi
          echo "${URL} answers 200."

          PROBE="${URL}/api/shema/session"
          BODY=$(curl -sS --max-time 30 "$PROBE" || true)
          if printf '%s' "$BODY" | grep -q '<div id="root">'; then
            echo "::error::${PROBE} answered with the application's own HTML, so /api is not being proxied: the mounted secret did not reach the revision. See docs/deploy.md §5."
            exit 1
          fi
          echo "${PROBE} is answered by the backend rather than by the page."

      - name: Show deployment URL
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          URL=$(gcloud run services describe "${FRONTEND_SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format="value(status.url)")
          echo "Deployed to: ${URL}"
          {
            echo "### Deploy"
            echo ""
            echo "- Serviço: \`${FRONTEND_SERVICE}\` (${REGION})"
            echo "- Tag: \`${TAG}\`"
            echo "- URL: ${URL}"
            echo "- Acesso: público, como os outros frontends da org."
          } >> "$GITHUB_STEP_SUMMARY"
